#cloud-config
package_update: true
packages:
  - apache2

write_files:
  - path: /var/www/html/index.html
    owner: root:root
    permissions: "0644"
    defer: true
    content: |
      <!doctype html>
      <html lang="en">
        <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>${student_name} | OpenTofu web server</title>
          <style>
            body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 12vh auto; padding: 0 1.5rem; color: #172033; }
            main { border-left: 0.4rem solid #3973ac; padding: 1rem 1.5rem; background: #f3f6fa; }
            h1 { margin-top: 0; }
          </style>
        </head>
        <body>
          <main>
            <h1>${student_name}</h1>
            <p>${page_message}</p>
          </main>
        </body>
      </html>

runcmd:
  - [systemctl, enable, --now, apache2]
